packages:
  - apps/*
  - packages/*
  - tools/*

catalog:
  "@hey-api/openapi-ts": ^0.96.0
  "@logtape/hono": ^2.0.5
  "@logtape/logtape": ^2.0.5
  "@types/node": ^24
  "@typespec/compiler": ^1.11.0
  "@typespec/http": ^1.11.0
  "@typespec/openapi3": ^1.11.0
  typescript: ^5
  valibot: ^1.3.1
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vite-plus: latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest

catalogMode: prefer
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
