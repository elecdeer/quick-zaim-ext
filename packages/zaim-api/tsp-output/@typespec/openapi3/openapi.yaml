                        type: string
                      service:
                        type: string
                      name:
                        type: string
                      original_name:
                        type: string
                      tel:
                        type: string
                      count:
                        type: integer
                        format: int32
                      place_pattern_id:
                        type: integer
                        format: int32
                      calc_flag:
                        type: integer
                        format: int32
                      edit_flag:
                        type: integer
                        format: int32
                      active:
                        type: integer
                        format: int32
                      modified:
                        type: string
                      created:
                        type: string
                    required:
                      - id
                      - user_id
                      - genre_id
                      - category_id
                      - account_id
                      - transfer_account_id
                      - mode
                      - place_uid
                      - service
                      - name
                      - original_name
                      - tel
                      - count
                      - place_pattern_id
                      - calc_flag
                      - edit_flag
                      - active
                      - modified
                      - created
                    description: Place information (only present if a place was specified)
                  user:
                    type: object
                    properties:
                      repeat_count:
                        type: integer
                        format: int32
                        description: Number of consecutive days of recording
                      day_count:
                        type: integer
                        format: int32
                        description: Total number of days with records
                      input_count:
                        type: integer
                        format: int32
                        description: Total number of inputs by the user
                    required:
                      - repeat_count
                      - day_count
                      - input_count
                  requested:
