packages:
  - apps/*
  - packages/*
  - tools/*

catalog:
  "@hey-api/openapi-ts": ^0.97.1
  "@hono/cli": ^0.1.10
  "@hono/standard-validator": ^0.2.2
  "@logtape/hono": ^2.0.5
  "@logtape/logtape": ^2.0.5
  "@tanstack/react-query": ^5.100.5
  "@types/node": ^25.6.0
  "@typespec/compiler": ^1.11.0
  "@typespec/http": ^1.11.0
  "@typespec/openapi3": ^1.11.0
  msw: ^2.13.6
  msw-storybook-addon: ^2.0.7
  typescript: ^6.0.3
  valibot: ^1.3.1
  vite: npm:@voidzero-dev/vite-plus-core@^0.1.23
  vite-plus: ^0.1.23
  vitest: npm:@voidzero-dev/vite-plus-test@^0.1.23

catalogMode: prefer
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
allowBuilds:
  esbuild: true
  msw: true
  sharp: true
  workerd: true
  spawn-sync: false
