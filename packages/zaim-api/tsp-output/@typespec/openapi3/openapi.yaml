                  - money
                  - user
                  - requested
                properties:
                  money:
                    type: object
                    properties:
                      id:
                        type: integer
                        format: int32
                        description: Unique ID given by Zaim for each input
                      modified:
                        type: string
                        description: Modification timestamp
                      place_uid:
                        type: string
                        description: Place UID (only present if a place was specified)
                    required:
                      - id
                      - modified
                  place:
                    type: object
                    properties:
                      id:
                        type: integer
                        format: int32
                      user_id:
                        type: integer
                        format: int32
