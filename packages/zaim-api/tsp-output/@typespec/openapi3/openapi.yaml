  /v2/home/money:
    get:
      operationId: Money_getMoney
      parameters:
        - name: mapping
          in: query
          required: true
          description: Required. Set to 1
          schema:
            type: number
            enum:
              - 1
          explode: false
        - name: category_id
          in: query
          required: false
          description: Filter by category ID
          schema:
            type: integer
            format: int32
          explode: false
        - name: genre_id
          in: query
          required: false
          description: Filter by genre ID
          schema:
            type: integer
            format: int32
          explode: false
        - name: mode
          in: query
          required: false
          description: Filter by transaction type
          schema:
            type: string
            enum:
              - payment
              - income
              - transfer
          explode: false
        - name: order
          in: query
          required: false
          description: "Sort by id or date (default: date)"
          schema:
            type: string
            enum:
              - id
              - date
          explode: false
        - name: start_date
          in: query
          required: false
          description: Start date in Y-m-d format
          schema:
            type: string
          explode: false
        - name: end_date
          in: query
          required: false
          description: End date in Y-m-d format
          schema:
            type: string
          explode: false
        - name: page
          in: query
          required: false
          description: "Page number (default: 1)"
          schema:
            type: integer
            format: int32
          explode: false
        - name: limit
          in: query
          required: false
          description: "Number of items per page (default: 20, max: 100)"
          schema:
            type: integer
            format: int32
          explode: false
        - name: group_by
          in: query
          required: false
          description: Group results by receipt_id
          schema:
            type: string
            enum:
              - receipt_id
          explode: false
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
